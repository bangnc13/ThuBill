<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
html,body,#m{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.leaflet-top{margin-top:48px}
.pin{width:26px;height:26px;border-radius:50%;background:#ea580c;color:#fff;border:2px solid #fff;display:grid;place-items:center;font:700 12px system-ui;box-shadow:0 1px 5px #0008}
.lbl{background:rgba(15,42,38,.88)!important;color:#fff!important;border:1px solid #14b8a6!important;border-radius:6px!important;padding:2px 6px!important;font:600 11.5px system-ui!important;box-shadow:0 2px 6px rgba(0,0,0,.45)!important;white-space:nowrap}
.lbl.leaflet-tooltip-top::before{border-top-color:rgba(15,42,38,.88)!important}
.me{position:relative;width:120px;height:120px}
.me .beam{position:absolute;inset:0;border-radius:50%;opacity:0;transition:transform .15s linear,opacity .3s;background:conic-gradient(from -32deg at 50% 50%,rgba(66,133,244,.9) 0 64deg,transparent 64deg);-webkit-mask-image:radial-gradient(circle,transparent 9px,#000 13px,transparent 58px);mask-image:radial-gradient(circle,transparent 9px,#000 13px,transparent 58px)}
.me .beam.on{opacity:1}
.me .pulse{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:#4285f4;animation:pl 2s ease-out infinite}
.me .dot{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 1px 6px #0006,0 0 12px 4px #4285f488}
@keyframes pl{0%{transform:scale(1);opacity:.75}100%{transform:scale(4.4);opacity:0}}
.hud{background:#0f2a26e6;color:#fff;padding:8px 12px;border-radius:12px;font:600 12.5px/1.35 system-ui;box-shadow:0 4px 14px #0006;backdrop-filter:blur(4px)}
.btn{display:block;width:34px;height:34px;line-height:34px;text-align:center;font-size:18px;background:#fff;color:#0f766e;border-radius:8px;box-shadow:0 1px 5px #0006;cursor:pointer;text-decoration:none;margin-top:8px;user-select:none}
#rst{position:relative}
#rst .nd{position:absolute;left:50%;top:50%;width:0;height:0;margin:-15px 0 0 -6px;transform-origin:6px 15px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:15px solid #ef4444}
#rst .nd::after{content:"";position:absolute;left:-6px;top:15px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:15px solid #94a3b8}
.btn.w{width:auto;padding:0 12px;font:700 13px/34px system-ui}
</style></head><body><div id="m"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>if(!L.Map.prototype.setBearing)document.write('<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"><\/script>')</script>
<script>
const post=(t,d)=>parent.postMessage({isStreamlitMessage:true,type:t,...d},'*');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
const dm=(a,b)=>{const r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 12742000*Math.asin(Math.sqrt(x))};

const map=L.map('m',{zoomControl:false,rotate:true,bearing:0,touchRotate:true,shiftKeyRotate:true,rotateControl:false});

// ---- Khởi tạo các Layer bản đồ (Mặc định: Đường phố) ----
const streetLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&hl=vi&gl=VN&x={x}&y={y}&z={z}',{
 maxZoom:22, maxNativeZoom:20, subdomains:['mt0','mt1','mt2','mt3'], attribution:'Map data © Google'
}).addTo(map); // Đặt layer đường phố làm mặc định

const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
 maxZoom:22, maxNativeZoom:18, attribution:'Tiles © Esri'
});

let satLayer = esriSat;
let isSat = false; // false = Đường phố (mặc định), true = Vệ tinh
let tileMsg='', gSet=false;

async function useGoogle(key){ // Google Map Tiles API: vệ tinh chính thức nếu có khóa API
 if(gSet||!key)return;gSet=true;
 try{
  const r=await fetch('https://tile.googleapis.com/v1/createSession?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mapType:'satellite',language:'vi-VN',region:'VN'})});
  const j=await r.json();if(!j.session)throw new Error((j.error&&j.error.message)||r.status);
  const g=L.tileLayer('https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session='+j.session+'&key='+encodeURIComponent(key),{maxZoom:22,maxNativeZoom:20,attribution:'Map data © Google'});
  let n=0;
  g.on('tileerror',()=>{
   if(++n==4){
    if(map.hasLayer(g))map.removeLayer(g);
    satLayer=esriSat;
    if(isSat&&!map.hasLayer(esriSat))esriSat.addTo(map);
    tileMsg='Ảnh Google lỗi, đang dùng ảnh Esri';hudText();
   }
  });
  satLayer=g;
  if(isSat){if(map.hasLayer(esriSat))map.removeLayer(esriSat);g.addTo(map)}
 }catch(e){tileMsg='Chưa dùng được ảnh Google: '+e.message;if(typeof last!=='undefined'&&last)hudText();else hudEl.textContent=tileMsg}
}

map.setView([16,107.5],6);
const layer=L.layerGroup().addTo(map);
let sig='',fitted=false;

// ---- Vẽ lộ trình / điểm đến (màu cam) ----
function render(a){
 if(a.tkey)useGoogle(a.tkey);
 const showName = a.show_name !== false; // Mặc định luôn hiển thị tên tập điểm
 const s=JSON.stringify([a.pts,a.line,showName]);if(s===sig)return;sig=s;
 layer.clearLayers();
 const all=a.line.slice();
 if(a.line.length){
  L.polyline(a.line,{color:'#fff',weight:9,opacity:.55}).addTo(layer);
  L.polyline(a.line,{color:'#f97316',weight:5,opacity:.95}).addTo(layer);
 }
 a.pts.forEach(p=>{
  all.push([p.lat,p.lng]);
  const m = p.l===''
   ? L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',weight:2,fillColor:'#f97316',fillOpacity:1})
   : L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',iconSize:[26,26],html:'<div class="pin">'+esc(p.l)+'</div>'})});
  if(p.n){
   m.bindTooltip(esc(p.n), {
    permanent: showName,
    direction: 'top',
    offset: [0, p.l==='' ? -8 : -14],
    className: 'lbl'
   });
  }
  m.addTo(layer);
 });
 if(all.length>1){map.fitBounds(all,{paddingTopLeft:[innerWidth>768?380:60,60],paddingBottomRight:[60,60]});fitted=true}
 else if(all.length){map.setView(all[0],16);fitted=true}
}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='streamlit:render')render(e.data.args||{pts:[],line:[]})});
post('streamlit:componentReady',{apiVersion:1});post('streamlit:setFrameHeight',{height:700});

// ---- Giao diện phụ: bảng tọa độ + nút đổi Layer + nút về vị trí ----
const hud=L.control({position:'bottomright'});
hud.onAdd=()=>{const d=L.DomUtil.create('div','hud');d.textContent='Đang chờ định vị…';return d};hud.addTo(map);
const hudEl=hud.getContainer();
const bar=L.control({position:'topright'});
bar.onAdd=()=>{
 const d=L.DomUtil.create('div');
 d.innerHTML='<a class="btn" id="lyr" title="Đổi nền Vệ tinh / Đường phố">🛰️</a><a class="btn" id="ctr" title="Về vị trí của tôi">◎</a><a class="btn" id="rst" title="Về hướng Bắc" style="display:none"><i class="nd"></i></a>';
 L.DomEvent.disableClickPropagation(d);
 return d;
};
bar.addTo(map);

// Xử lý nút chuyển đổi Đường phố <-> Vệ tinh
const lyrBtn=document.getElementById('lyr');
lyrBtn.onclick=()=>{
 isSat=!isSat;
 if(isSat){
  if(map.hasLayer(streetLayer))map.removeLayer(streetLayer);
  satLayer.addTo(map);
  lyrBtn.textContent='🗺️';
  lyrBtn.title='Chuyển sang bản đồ Đường phố';
 }else{
  if(map.hasLayer(satLayer))map.removeLayer(satLayer);
  if(map.hasLayer(esriSat))map.removeLayer(esriSat);
  streetLayer.addTo(map);
  lyrBtn.textContent='🛰️';
  lyrBtn.title='Chuyển sang bản đồ Vệ tinh';
 }
};

const rst=document.getElementById('rst'),nd=rst.querySelector('.nd');
if(map.setBearing){
 map.on('rotate',()=>{const b=map.getBearing();rst.style.display=Math.abs(((b+180)%360)-180)>1?'block':'none';nd.style.transform='rotate('+(-b)+'deg)';applyBeam()});
 rst.onclick=()=>map.setBearing(0);
}
document.getElementById('ctr').onclick=()=>{if(last)map.setView([last.lat,last.lng],Math.max(map.getZoom(),17))};

// ---- Vị trí realtime + hướng (la bàn) ----
let needPerm=false,asking=false,gotAbs=false,lastRel=0,sensorMsg='Đang chờ cảm biến hướng…',last=null,pub=null,mk=null,ring=null,cone=null,rot=null,hasCompass=false,hd=null;
function hudText(){
 if(!last)return;
 hudEl.innerHTML='📍 '+last.lat.toFixed(5)+', '+last.lng.toFixed(5)+' · ±'+Math.round(last.acc)+' m'+'<br>'+(hd!=null?'🧭 Hướng '+Math.round(hd)+'°':needPerm?'Chạm bản đồ để bật hướng':sensorMsg)+(tileMsg?'<br>'+tileMsg:'');
}
function applyBeam(){if(cone&&rot!=null){cone.classList.add('on');cone.style.transform='rotate('+(rot-(map.getBearing?map.getBearing():0))+'deg)'}}
function setHeading(h){
 rot=rot==null?h:rot+((((h-(rot%360))+540)%360)-180)*0.3;
 hd=((rot%360)+360)%360;
 applyBeam();
 hudText();
}
function onPos(p){
 const c=p.coords;last={lat:c.latitude,lng:c.longitude,acc:c.accuracy};
 if(!mk){
  mk=L.marker([last.lat,last.lng],{zIndexOffset:2000,interactive:false,icon:L.divIcon({className:'',iconSize:[120,120],html:'<div class="me"><div class="beam"></div><div class="pulse"></div><div class="dot"></div></div>'})}).addTo(map);
  ring=L.circle([last.lat,last.lng],{radius:last.acc,color:'#3b82f6',weight:1,fillColor:'#3b82f6',fillOpacity:.1,interactive:false}).addTo(map);
  cone=mk.getElement().querySelector('.beam');applyBeam();
 }else{mk.setLatLng([last.lat,last.lng]);ring.setLatLng([last.lat,last.lng]).setRadius(last.acc)}
 if(!hasCompass&&c.heading!=null&&!isNaN(c.heading)&&c.speed>1)setHeading(c.heading);
 hudText();
 if(!fitted){map.setView([last.lat,last.lng],16);fitted=true}
 if(!pub||dm(pub,last)>=20||(pub.acc>100&&last.acc<pub.acc/2)){
  pub={...last};post('streamlit:setComponentValue',{value:{lat:last.lat,lon:last.lng,acc:last.acc},dataType:'json'});
 }
}
let t0=performance.now();
function onOri(e){
 let h=null;
 if(e.webkitCompassHeading!=null&&!isNaN(e.webkitCompassHeading))h=e.webkitCompassHeading;           // iOS
 else if(e.alpha!=null&&(e.absolute||e.type==='deviceorientationabsolute')){h=360-e.alpha;gotAbs=true} // Android Chrome
 else if(e.alpha!=null){lastRel=360-e.alpha;if(!gotAbs&&performance.now()-t0>2500)h=lastRel}           // trình duyệt không có sự kiện tuyệt đối (vd. Firefox)
 if(h==null||isNaN(h))return;
 hasCompass=true;
 setHeading((h+((screen.orientation&&screen.orientation.angle)||0)+360)%360);
}
function startCompass(){
 const D=window.DeviceOrientationEvent;
 if(D&&typeof D.requestPermission==='function'){
  asking=true;
  D.requestPermission().then(r=>{if(r==='granted'){addEventListener('deviceorientation',onOri,true);needPerm=false;hudText()}}).catch(()=>{}).finally(()=>{asking=false});
 }else{addEventListener('deviceorientationabsolute',onOri,true);addEventListener('deviceorientation',onOri,true)}
}
if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
 needPerm=true;addEventListener('pointerup',()=>{if(needPerm&&!asking)startCompass()}); // iOS: cần chạm để cấp quyền
}else startCompass();
setTimeout(()=>{if(hd==null){sensorMsg='Chưa nhận được cảm biến hướng';hudText()}},4000);
if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,e=>{hudEl.textContent='Chưa có quyền định vị. Hãy cho phép vị trí cho trang này.'},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
else hudEl.textContent='Thiết bị không hỗ trợ định vị.';
</script></body></html>
